# Tests every pull request, and deploys to your Harper cluster when a change merges to `main`. The
# deploy job holds no Harper credential: its `harper` commands authenticate with GitHub's OIDC token
# under a trust policy on the cluster. Set that up once with
# `your-package-manager-run-here deploy:setup-ci` (see "Deployment" in the README). The deploy job
# runs `next build` and uploads it, because building on the cluster currently fails
# (HarperFast/nextjs#57, HarperFast/nextjs#58).
name: Deploy to Harper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so an older commit can't deploy after a newer one; a newer run
# replaces one still waiting. On a pull request, a new push cancels the run in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # your-package-manager-setup-step-here
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # your-package-manager-node-cache-here
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: your-package-manager-install-here
      - name: Run lint
        run: your-package-manager-run-here lint

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      HARPER_CLI_TARGET: ${{ vars.HARPER_CLI_TARGET }}
    steps:
      - name: Refuse to redeploy an older commit
        # Re-running an old run keeps its commit, which would replace a newer release.
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          [ "$HEAD" = "$GITHUB_SHA" ] || { echo "::error::$GITHUB_REF_NAME is now at $HEAD; re-running this deploy would replace it with $GITHUB_SHA"; exit 1; }
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy uploads this directory, `.git` included, so keep the job's token out of it.
          persist-credentials: false
      # your-package-manager-setup-step-here
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # your-package-manager-node-cache-here
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: your-package-manager-install-here
      - name: Build
        run: your-package-manager-run-here build
      - name: Install Harper CLI
        # 5.3 is the first CLI that authenticates with the OIDC token.
        run: npm install --global harper@^5.3
      - name: Deploy
        run: |
          # With no target the CLI would fall back to a saved login or a local node, and succeed.
          [ -n "$HARPER_CLI_TARGET" ] || { echo "::error::Set the HARPER_CLI_TARGET repository variable: run your-package-manager-run-here deploy:setup-ci"; exit 1; }
          harper deploy project=your-component-name-here restart=rolling json=true > "$RUNNER_TEMP/deploy.json"
      - name: Wait for every node to take the release
        # The deploy returns once the node it reached has the release; the others take it in a job.
        run: |
          JOB_ID=$(jq -r '.restartJobId // empty' "$RUNNER_TEMP/deploy.json")
          [ -n "$JOB_ID" ] || { echo "::error::The rolling deploy returned no restartJobId"; exit 1; }
          LAST="could not be read"
          for attempt in $(seq 60); do
            sleep 10
            harper get_job id="$JOB_ID" json=true > "$RUNNER_TEMP/job.json" || continue
            case $(jq -r '.[0].status // "MISSING"' "$RUNNER_TEMP/job.json") in
              COMPLETE) exit 0 ;;
              ERROR) jq -r '.[0].message' "$RUNNER_TEMP/job.json"; exit 1 ;;
              MISSING) LAST="was not on the node that answered; its outcome is unknown" ;;
              *) LAST="was still running" ;;
            esac
          done
          echo "::error::After 60 polls, job $JOB_ID $LAST"
          exit 1
      - name: Summarize
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -s "$RUNNER_TEMP/deploy.json" ] || exit 0
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### Deployed your-component-name-here"
            elif jq -e '.deployment_id' "$RUNNER_TEMP/deploy.json" > /dev/null; then
              echo "### Deploy of your-component-name-here did not complete on every node"
            else
              echo "### Deploy of your-component-name-here failed"
            fi
            jq -r '"- Deployment: `\(.deployment_id // "unknown")`\n- Certification: `\(.certification // "not reported")`"' "$RUNNER_TEMP/deploy.json"
            echo ""
            echo "To go back to an earlier release, list them with \`harper list_deployments project=your-component-name-here\`,"
            echo "then activate one with \`harper deploy project=your-component-name-here deployment_id=<id> restart=rolling\`."
          } >> "$GITHUB_STEP_SUMMARY"
