# Deploys this app to your Harper cluster by *payload* via `harper deploy_component .`
# (`npm run deploy`), which runs `next build` first and uploads the prebuilt `.next` output.
#
# The other create-harper templates deploy by *reference* (`harper deploy by_ref=true`), where the
# cluster clones your repo and builds on the node. Next.js can't use that yet: `.next` is gitignored
# (so a git reference carries no build output) and building on the cluster currently fails —
# Turbopack crashes inside a Harper worker thread (HarperFast/nextjs#57) and a webpack build
# overruns the component-load timeout (HarperFast/nextjs#58). Once those land, this template can
# switch to the by-reference workflow like the rest.
#
# Runs on a version tag (e.g. `git tag v1.2.3 && git push --tags`) or manually.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   HARPER_CLI_TARGET         your cluster's operations URL, e.g. https://my-cluster.harperdb.io:9925
#   HARPER_CLI_REFRESH_TOKEN  a long-lived refresh token; the CLI mints a short-lived operation
#                             token from it on each run, so no password is stored in CI
#
# Set both in one command — this pipes them straight from your cluster into GitHub, so the token
# never appears on screen or in your shell history:
#
#   harper login --for-ci | gh secret set --env-file -
name: Deploy to Harper Fabric
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Install Harper CLI
        # Pinned to the 5.2 line; ^5.2.0 blocks a breaking 6.x bump.
        run: npm install -g harper@^5.2.0
      - name: Build & deploy
        run: npm run deploy
        env:
          HARPER_CLI_TARGET: ${{ secrets.HARPER_CLI_TARGET }}
          HARPER_CLI_REFRESH_TOKEN: ${{ secrets.HARPER_CLI_REFRESH_TOKEN }}
