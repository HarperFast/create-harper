# Tests every pull request, and deploys to your Harper cluster when a change merges to `main`. The
# deploy job runs `next build` here and uploads the build, since `.next` is not in the repository
# and building on the cluster currently fails (HarperFast/nextjs#57, HarperFast/nextjs#58).
#
# The deploy job holds no Harper credential. It runs plain `harper` commands, and because the job
# may request a GitHub OIDC identity token (`id-token: write`) and HARPER_CLI_TARGET names your
# cluster, each one authenticates by trading that token under a trust policy on the cluster.
#
# One-time setup, from this project on your machine (Harper 5.4+, signed in to the cluster as a
# super user with `harper login`):
#
#   your-package-manager-run-here deploy:setup-ci
#
# It creates the trust policy and a deploy-only user on the cluster, and sets the HARPER_CLI_TARGET
# repository variable. See the "Deployment" section of the README.
name: Deploy to Harper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # your-package-manager-setup-step-here
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # your-package-manager-node-cache-here
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: your-package-manager-install-here
      - name: Run lint
        run: your-package-manager-run-here lint

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The trust policy pins this environment. Under Settings → Environments you can also limit it to
    # `main`, or require a reviewer before a deploy runs.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # A repository variable, not a secret: it is only the cluster's address.
      HARPER_CLI_TARGET: ${{ vars.HARPER_CLI_TARGET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy uploads this directory, `.git` included, so keep the job's token out of it.
          persist-credentials: false
      # your-package-manager-setup-step-here
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # your-package-manager-node-cache-here
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: your-package-manager-install-here
      - name: Build
        run: your-package-manager-run-here build
      - name: Install Harper CLI
        # With npm whatever this project uses: it is a global tool, and npm comes with Node.js. 5.3
        # is the first CLI that authenticates with the OIDC token.
        run: npm install --global harper@^5.3
      - name: Deploy
        run: |
          # With no target the CLI would fall back to a saved login or a local node, and succeed.
          [ -n "$HARPER_CLI_TARGET" ] || { echo "::error::Set the HARPER_CLI_TARGET repository variable: run your-package-manager-run-here deploy:setup-ci"; exit 1; }
          harper deploy project=your-project-name-here restart=rolling json=true > "$RUNNER_TEMP/deploy.json"
      - name: Wait for every node to take the release
        # The deploy step passes once the node it reached has the release. The others take it one at
        # a time in a job, and a node that rejects it fails that job, so wait for it.
        run: |
          JOB_ID=$(jq -r '.restartJobId // empty' "$RUNNER_TEMP/deploy.json")
          [ -n "$JOB_ID" ] || { echo "::error::The rolling deploy returned no restartJobId"; exit 1; }
          LAST="could not be read"
          for attempt in $(seq 60); do
            sleep 10
            harper get_job id="$JOB_ID" json=true > "$RUNNER_TEMP/job.json" || continue
            case $(jq -r '.[0].status // "MISSING"' "$RUNNER_TEMP/job.json") in
              COMPLETE) exit 0 ;;
              ERROR) jq -r '.[0].message' "$RUNNER_TEMP/job.json"; exit 1 ;;
              MISSING) LAST="was not on the node that answered; its outcome is unknown" ;;
              *) LAST="was still running" ;;
            esac
          done
          echo "::error::After 60 polls, job $JOB_ID $LAST"
          exit 1
      - name: Summarize
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/deploy.json" ] || exit 0
          {
            echo "### Deployed your-project-name-here"
            jq -r '"- Deployment: `\(.deployment_id // "unknown")`\n- Certification: `\(.certification // "not reported")`"' "$RUNNER_TEMP/deploy.json"
            echo ""
            echo "To go back to an earlier release, list them with \`harper list_deployments project=your-project-name-here\`,"
            echo "then activate one with \`harper deploy project=your-project-name-here deployment_id=<id> restart=rolling\`."
          } >> "$GITHUB_STEP_SUMMARY"
