# Tests every pull request, and deploys to your Harper cluster when a change merges to `main`. The
# deploy job holds no Harper credential: HarperFast/deploy-action authenticates with GitHub's OIDC
# token under a trust policy on the cluster. Set that up once with
# `your-package-manager-run-here deploy:setup-ci` (see "Deployment" in the README). The test job
# runs `next build` and hands it to the deploy job, which uploads it, because building on the cluster
# currently fails (HarperFast/nextjs#57, HarperFast/nextjs#58).
name: Deploy to Harper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so an older commit can't deploy after a newer one; a newer run
# replaces one still waiting. On a pull request, a new push cancels the run in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # your-package-manager-setup-step-here
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # your-package-manager-node-cache-here
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: your-package-manager-install-here
      - name: Run lint
        run: your-package-manager-run-here lint
      - name: Build
        run: your-package-manager-run-here build
      - name: Hand the build to the deploy job
        # Building here keeps your dependencies' scripts out of the job that can request an OIDC token.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          # A re-run of the whole workflow builds again, under the same name.
          overwrite: true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      HARPER_CLI_TARGET: ${{ vars.HARPER_CLI_TARGET }}
    steps:
      - name: Refuse to redeploy an older commit
        # Re-running an old run keeps its commit, which would replace a newer release.
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          [ "$HEAD" = "$GITHUB_SHA" ] || { echo "::error::$GITHUB_REF_NAME is now at $HEAD; re-running this deploy would replace it with $GITHUB_SHA"; exit 1; }
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy uploads this directory, `.git` included, so keep the job's token out of it.
          persist-credentials: false
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: .next
      - name: Check the deploy target
        # The action refuses an empty target too, but can't say which script sets it.
        run: |
          [ -n "$HARPER_CLI_TARGET" ] || { echo "::error::Set the HARPER_CLI_TARGET repository variable: run your-package-manager-run-here deploy:setup-ci"; exit 1; }
      - name: Deploy
        # From Harper 5.4 this waits for every node, and fails the run if a node's canary rejects the release.
        uses: HarperFast/deploy-action@v1
        with:
          target: ${{ env.HARPER_CLI_TARGET }}
          app: your-component-name-here
          restart: rolling
